<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @keyframes spm-spin{to{transform:rotate(360deg)}}
  @keyframes spm-pulse{0%,100%{opacity:.45}50%{opacity:1}}
  *{box-sizing:border-box}
</style>
</helmet>
<div style="min-height:100%;padding:34px;background:#eef1f6;display:flex;align-items:flex-start;justify-content:center;font-family:system-ui">
<div style="width:920px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(20,22,40,.30),0 6px 18px -8px rgba(20,22,40,.16);border:1px solid rgba(0,0,0,.06)">
  <div style="height:44px;display:flex;align-items:center;padding:0 16px;background:#fbfbfc;border-bottom:1px solid #eeeef1;position:relative">
    <div style="display:flex;gap:8px"><div style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></div><div style="width:12px;height:12px;border-radius:50%;background:#febc2e"></div><div style="width:12px;height:12px;border-radius:50%;background:#28c840"></div></div>
    <div style="position:absolute;left:0;right:0;text-align:center;font:600 13px system-ui;color:#3a3a42;pointer-events:none">{{ title }}</div>
  </div>
  <div style="display:flex;min-height:560px">
    <!-- icon rail -->
    <div style="width:66px;background:#1c2130;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(150deg,#3d8bff,#2f5bff);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -3px rgba(47,107,255,.7);margin-bottom:8px"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 3l1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9z" fill="#fff"/></svg></div>
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
        <div onClick="{{ tab.go }}" style="{{ tab.style }}"><span style="{{ tab.iconWrap }}">{{ tab.icon }}</span><span style="font:600 8px system-ui">{{ tab.label }}</span></div>
      </sc-for>
      <div style="margin-top:auto;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#8a90a6"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke-linecap="round"/></svg></div>
    </div>
    <div style="flex:1;min-width:0">{{ screen }}</div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const R = React.createElement;
const ICONS = {
  care: R('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.9,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M4 11l8-7 8 7'}),R('path',{d:'M6 10v9h12v-9'})),
  clean: R('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.9,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M14 4l6 6-9 9-6-6z'}),R('path',{d:'M8 10l6 6'})),
  disk: R('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.9},R('circle',{cx:12,cy:12,r:8}),R('path',{d:'M12 12V5M12 12l6 3.5',strokeLinecap:'round'})),
  apps: R('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.9,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M4 7h16M9 7V5h6v2M6.5 7l1 12.5h9l1-12.5'})),
};
const check = (sz,col) => R('svg',{width:sz,height:sz,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:3.2,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M5 12l4 4 10-10'}));

class Component extends DCLogic {
  state = { active: 'care' };
  go(id){ this.setState({active:id}); }

  dashboard(){
    const stat = (bg,ic,name,sub) => R('div',{style:{background:'#fff',border:'1px solid #eef0f2',borderRadius:12,padding:12}},
      R('div',{style:{display:'flex',alignItems:'center',gap:8,font:'600 13px system-ui',color:'#20222c'}},
        R('span',{style:{width:24,height:24,borderRadius:7,background:bg,display:'flex',alignItems:'center',justifyContent:'center'}},ic),name),
      R('div',{style:{font:'400 11.5px system-ui',color:'#86868e',marginTop:6}},sub));
    return R('div',{style:{display:'flex',height:'100%'}},
      R('div',{style:{flex:1,padding:'28px 32px',display:'flex',flexDirection:'column',alignItems:'center',background:'radial-gradient(120% 90% at 50% -10%,#eef4ff,#fff 60%)'}},
        R('div',{style:{font:'700 23px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'Ваш Mac в отличной форме'),
        R('div',{style:{font:'400 13px system-ui',color:'#86868e',marginTop:3}},'Последний уход — сегодня в 09:14'),
        R('div',{style:{position:'relative',width:206,height:206,marginTop:22,display:'flex',alignItems:'center',justifyContent:'center'}},
          R('div',{style:{position:'absolute',inset:0,borderRadius:'50%',background:'conic-gradient(#22c55e 0 92%,#e8ebf0 0)'}}),
          R('div',{style:{position:'absolute',inset:12,borderRadius:'50%',background:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',boxShadow:'0 8px 24px -12px rgba(34,197,94,.5)'}},
            R('div',{style:{font:'800 56px system-ui',letterSpacing:'-.03em',lineHeight:1,color:'#16161b'}},'92'),
            R('div',{style:{display:'flex',alignItems:'center',gap:5,marginTop:4,font:'600 12px system-ui',color:'#16a34a'}},R('span',{style:{width:7,height:7,borderRadius:'50%',background:'#22c55e'}}),'Отлично'))),
        R('button',{onClick:()=>this.go('clean'),style:{marginTop:24,border:'none',background:'linear-gradient(150deg,#3d8bff,#2f5bff)',color:'#fff',font:'700 15px system-ui',padding:'15px 42px',borderRadius:14,cursor:'pointer',boxShadow:'0 12px 26px -8px rgba(47,91,255,.6)'}},'Запустить умный уход'),
        R('div',{style:{font:'400 12px system-ui',color:'#9a9aa0',marginTop:11}},'Проверит кеши, память, программы и диск — 14,2 ГБ можно освободить')),
      R('div',{style:{width:220,borderLeft:'1px solid #eeeef1',padding:'20px 16px',background:'#fafbfc',display:'flex',flexDirection:'column',gap:10}},
        R('div',{style:{font:'700 11px system-ui',color:'#9a9aa0',textTransform:'uppercase',letterSpacing:'.05em'}},'Состояние систем'),
        stat('#e6f7ec',check(14,'#16a34a'),'Чистота','14,2 ГБ мусора найдено'),
        stat('#e8efff',R('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'#2f6bff',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M13 2L4 14h6l-1 8 9-12h-6z'})),'Память','свободно 6,3 ГБ · норма'),
        stat('#fff2e6',R('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'#ea8a1e',strokeWidth:2},R('circle',{cx:12,cy:12,r:8}),R('path',{d:'M12 12V5M12 12l6 3.5',strokeLinecap:'round'})),'Диск','238 ГБ из 512 ГБ свободно'),
        R('div',{style:{marginTop:'auto',background:'#1c2130',borderRadius:12,padding:12,color:'#fff'}},
          R('div',{style:{font:'600 12px system-ui'}},'Защита в реальном времени'),
          R('div',{style:{display:'flex',alignItems:'center',gap:6,marginTop:6,font:'400 11px system-ui',color:'#a8d8ff'}},R('span',{style:{width:7,height:7,borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 8px #22c55e'}}),'включена'))));
  }

  cleaning(){
    const done = (name,val) => R('div',{style:{display:'flex',alignItems:'center',gap:12,background:'#f7faff',border:'1px solid #e8eef8',borderRadius:12,padding:'12px 15px'}},
      R('div',{style:{width:18,height:18,borderRadius:6,background:'#22c55e',display:'flex',alignItems:'center',justifyContent:'center'}},check(11,'#fff')),
      R('div',{style:{flex:1,font:'600 13px system-ui',color:'#20222c'}},name),
      R('div',{style:{font:'600 13px system-ui',color:'#16a34a'}},'очищено · '+val));
    return R('div',{style:{padding:'28px 32px 24px',background:'radial-gradient(120% 90% at 50% -10%,#eef4ff,#fff 60%)'}},
      R('div',{style:{display:'flex',alignItems:'center',gap:22}},
        R('div',{style:{position:'relative',width:132,height:132,flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center'}},
          R('div',{style:{position:'absolute',inset:0,borderRadius:'50%',background:'conic-gradient(from -90deg,#3d8bff 0 61%,#e8ebf0 0)'}}),
          R('div',{style:{position:'absolute',inset:10,borderRadius:'50%',background:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',boxShadow:'0 8px 20px -12px rgba(47,91,255,.5)'}},
            R('div',{style:{font:'800 32px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'61',R('span',{style:{fontSize:15,color:'#9a9aa0'}},'%')),
            R('div',{style:{font:'500 10.5px system-ui',color:'#9a9aa0',marginTop:1}},'очистка'))),
        R('div',{style:{flex:1}},
          R('div',{style:{font:'700 20px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'Наводим порядок…'),
          R('div',{style:{font:'400 13px system-ui',color:'#86868e',marginTop:4}},'Уже освобождено ',R('b',{style:{color:'#16161b'}},'8,7 ГБ'),' из 14,2 ГБ · осталось ~20 сек'),
          R('div',{style:{font:'400 12px system-ui',color:'#9a9aa0',marginTop:10}},'~/Library/Caches/com.google.Chrome/Default/Cache…'),
          R('button',{onClick:()=>this.go('care'),style:{marginTop:14,border:'1px solid #e0e2e8',background:'#fff',color:'#5a5a66',font:'600 12.5px system-ui',padding:'8px 18px',borderRadius:10,cursor:'pointer'}},'Остановить'))),
      R('div',{style:{marginTop:22,display:'flex',flexDirection:'column',gap:8}},
        done('Системный кеш','4,3 ГБ'),
        done('Кеш приложений','3,1 ГБ'),
        R('div',{style:{display:'flex',alignItems:'center',gap:12,background:'#eef4ff',border:'1px solid #d6e2ff',borderRadius:12,padding:'12px 15px'}},
          R('div',{style:{width:16,height:16,borderRadius:'50%',border:'2px solid #2f6bff',borderTopColor:'transparent',animation:'spm-spin .7s linear infinite'}}),
          R('div',{style:{flex:1,font:'600 13px system-ui',color:'#20222c'}},'Данные браузеров',R('span',{style:{color:'#2f6bff',fontWeight:500}},' · чистим')),
          R('div',{style:{font:'600 13px system-ui',color:'#2f6bff',animation:'spm-pulse 1s infinite'}},'1,3 ГБ')),
        R('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'12px 15px',opacity:.5}},
          R('div',{style:{width:16,height:16,borderRadius:'50%',background:'#dfe2e8'}}),
          R('div',{style:{flex:1,font:'500 13px system-ui',color:'#86868e'}},'Журналы, корзина, оптимизация ОЗУ'),
          R('div',{style:{font:'500 13px system-ui',color:'#a6a6ac'}},'в очереди'))));
  }

  disk(){
    const row = (icon,name,size,pct,grad) => R('div',{style:{display:'flex',alignItems:'center',gap:13}},
      R('div',{style:{width:34,height:34,borderRadius:9,background:grad?'#fff3e6':'#eef4ff',display:'flex',alignItems:'center',justifyContent:'center'}},icon),
      R('div',{style:{flex:1}},
        R('div',{style:{display:'flex',justifyContent:'space-between',font:'600 13px system-ui',color:'#20222c'}},R('span',null,name),R('span',null,size)),
        R('div',{style:{height:7,borderRadius:4,background:'#eef0f3',marginTop:5,overflow:'hidden'}},
          R('div',{style:{width:pct,height:'100%',background:grad||'linear-gradient(90deg,#3d8bff,#2f5bff)'}}))));
    const fileIcon = R('svg',{width:17,height:17,viewBox:'0 0 24 24',fill:'none',stroke:'#2f6bff',strokeWidth:1.8,strokeLinejoin:'round'},R('path',{d:'M7 3.5h7l4 4v13H7z'}),R('path',{d:'M14 3.5v4h4'}));
    const appIcon = R('svg',{width:17,height:17,viewBox:'0 0 24 24',fill:'none',stroke:'#2f6bff',strokeWidth:1.8},R('rect',{x:3,y:4,width:18,height:16,rx:2.5}),R('path',{d:'M3 9h18'}));
    const dlIcon = R('svg',{width:17,height:17,viewBox:'0 0 24 24',fill:'none',stroke:'#ea8a1e',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M12 3v13M7 11l5 5 5-5M5 21h14'}));
    return R('div',{style:{padding:'24px 32px'}},
      R('div',{style:{display:'flex',alignItems:'baseline',justifyContent:'space-between'}},
        R('div',{style:{font:'700 21px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'Macintosh HD'),
        R('div',{style:{font:'500 13px system-ui',color:'#86868e'}},'274 ГБ занято · 238 ГБ свободно')),
      R('div',{style:{height:16,borderRadius:8,background:'#eef0f3',overflow:'hidden',display:'flex',marginTop:14}},
        R('div',{style:{width:'56%',background:'#2f5bff'}}),R('div',{style:{width:'26%',background:'#3d8bff'}}),R('div',{style:{width:'18%',background:'#22c55e'}})),
      R('div',{style:{display:'flex',gap:18,marginTop:11,flexWrap:'wrap'}},
        R('div',{style:{display:'flex',alignItems:'center',gap:7,font:'500 12px system-ui',color:'#5a5a66'}},R('span',{style:{width:9,height:9,borderRadius:3,background:'#2f5bff'}}),'Система · 154 ГБ'),
        R('div',{style:{display:'flex',alignItems:'center',gap:7,font:'500 12px system-ui',color:'#5a5a66'}},R('span',{style:{width:9,height:9,borderRadius:3,background:'#3d8bff'}}),'Программы · 72 ГБ'),
        R('div',{style:{display:'flex',alignItems:'center',gap:7,font:'500 12px system-ui',color:'#5a5a66'}},R('span',{style:{width:9,height:9,borderRadius:3,background:'#22c55e'}}),'Документы · 48 ГБ')),
      R('div',{style:{font:'700 11px system-ui',color:'#9a9aa0',textTransform:'uppercase',letterSpacing:'.05em',margin:'22px 0 12px'}},'Крупнейшие папки'),
      R('div',{style:{display:'flex',flexDirection:'column',gap:12}},
        row(R('span',{style:{font:'700 12px system-ui',color:'#2f6bff'}},'go'),'go','8,48 ГБ','100%'),
        row(fileIcon,'Documents','7,59 ГБ','89%'),
        row(appIcon,'Applications','6,60 ГБ','78%'),
        row(dlIcon,'Downloads','2,62 ГБ','31%','linear-gradient(90deg,#ffb35a,#ea8a1e)')));
  }

  apps(){
    const item = (checked,name,path,size,col) => R('div',{style:{display:'flex',alignItems:'center',gap:11,padding:'11px 15px',borderBottom:'1px solid #f1f2f5'}},
      checked ? R('div',{style:{width:18,height:18,borderRadius:5,background:'#2f6bff',display:'flex',alignItems:'center',justifyContent:'center'}},check(11,'#fff'))
              : R('div',{style:{width:18,height:18,borderRadius:5,border:'1.5px solid #cfd2d8'}}),
      R('div',{style:{flex:1}},R('div',{style:{font:'600 13px system-ui',color:'#20222c'}},name),R('div',{style:{font:'400 11px system-ui',color:'#9a9aa0'}},path)),
      R('div',{style:{font:'600 12.5px system-ui',color:col||'#46474e'}},size));
    return R('div',{style:{padding:'20px 32px 24px'}},
      R('div',{style:{display:'flex',alignItems:'center',gap:14}},
        R('div',{style:{width:52,height:52,borderRadius:13,background:'linear-gradient(150deg,#ff8a5b,#ff5e3a)',display:'flex',alignItems:'center',justifyContent:'center',font:'700 26px system-ui',color:'#fff',boxShadow:'0 6px 16px -4px rgba(255,94,58,.5)'}},'C'),
        R('div',{style:{flex:1}},R('div',{style:{font:'800 22px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'Удалить Claude'),R('div',{style:{font:'400 12.5px system-ui',color:'#86868e'}},'6 объектов · будет освобождено 23,7 ГБ')),
        R('div',{style:{textAlign:'right'}},R('div',{style:{font:'800 22px system-ui',letterSpacing:'-.02em',color:'#16161b'}},'23,7 ГБ'),R('div',{style:{font:'400 11px system-ui',color:'#9a9aa0'}},'всего'))),
      R('div',{style:{marginTop:18,border:'1px solid #eef0f3',borderRadius:13,overflow:'hidden'}},
        item(true,'Программа','/Applications/Claude.app','740,9 МБ'),
        item(true,'Application Support','~/Library/Application Support/Claude/','22,95 ГБ','#ea8a1e'),
        item(true,'Caches · Logs · Preferences','~/Library/Caches, Logs, Preferences','37,9 МБ'),
        R('div',{style:{display:'flex',alignItems:'center',gap:11,padding:'11px 15px'}},
          R('div',{style:{width:18,height:18,borderRadius:5,border:'1.5px solid #cfd2d8'}}),
          R('div',{style:{flex:1}},R('div',{style:{font:'600 13px system-ui',color:'#20222c'}},'Saved State'),R('div',{style:{font:'400 11px system-ui',color:'#9a9aa0'}},'~/Library/Saved Application State/')),
          R('div',{style:{font:'600 12.5px system-ui',color:'#46474e'}},'2,1 МБ'))),
      R('div',{style:{display:'flex',alignItems:'center',gap:9,background:'#fff8ec',border:'1px solid #ffe8c2',borderRadius:11,padding:'11px 14px',marginTop:14}},
        R('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#ea8a1e',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},R('path',{d:'M12 3l9 16H3z'}),R('path',{d:'M12 10v4M12 17.5v.01'})),
        R('div',{style:{font:'400 12px/1.4 system-ui',color:'#8a6a2e'}},'Каталог поддержки очень большой — проверьте, нет ли в нём нужных данных, прежде чем удалять.')),
      R('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:16}},
        R('div',{style:{font:'500 12.5px system-ui',color:'#86868e'}},'Выбрано ',R('b',{style:{color:'#16161b'}},'23,7 ГБ'),' из 6 объектов'),
        R('div',{style:{display:'flex',gap:10}},
          R('button',{onClick:()=>this.go('care'),style:{border:'1px solid #e0e2e8',background:'#fff',color:'#5a5a66',font:'600 13px system-ui',padding:'11px 20px',borderRadius:11,cursor:'pointer'}},'Отмена'),
          R('button',{style:{border:'none',background:'linear-gradient(150deg,#ff6e5a,#ff3c32)',color:'#fff',font:'700 13px system-ui',padding:'11px 24px',borderRadius:11,cursor:'pointer',boxShadow:'0 8px 18px -6px rgba(255,60,50,.55)'}},'Удалить полностью'))));
  }

  renderVals(){
    const active = this.state.active;
    const defs = [
      { id:'care', label:'Уход', key:'care' },
      { id:'clean', label:'Чистка', key:'clean' },
      { id:'apps', label:'Прогр.', key:'apps' },
      { id:'disk', label:'Диск', key:'disk' },
    ];
    const tabs = defs.map(d => {
      const on = active === d.id || (d.id==='care'&&false);
      const sel = active === d.id;
      return {
        go: () => this.go(d.id),
        label: d.label,
        icon: ICONS[d.key],
        style: { width:44,height:44,borderRadius:11,background: sel?'rgba(255,255,255,.14)':'transparent', display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2, color: sel?'#fff':'#8a90a6', cursor:'pointer' },
        iconWrap: { display:'flex' },
      };
    });
    const titles = { care:'SpotlessMac', clean:'Умный уход', disk:'Диск', apps:'Программы' };
    const screens = { care:this.dashboard(), clean:this.cleaning(), disk:this.disk(), apps:this.apps() };
    return { tabs, title: titles[active], screen: screens[active] };
  }
}
</script>
</body>
</html>
